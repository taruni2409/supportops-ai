services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: supportops-ai-backend

    ports:
      - "8001:8001"

    env_file:
      - .env

    environment:
      OMP_NUM_THREADS: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        environment:
        - NODE_ENV=production

    container_name: supportops-ai-frontend

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy